<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-label="Reword logo">
  <defs>
    <!-- App-like gradient (indigo -> purple) -->
    <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle highlight -->
    <linearGradient id="gHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Transparent background (works on dark UI) -->
  <g filter="url(#shadow)">
    <!-- Icon container -->
    <rect x="60" y="50" width="160" height="160" rx="44" fill="url(#gGlass)" stroke="#1F2937" stroke-opacity="0.8"/>
    <rect x="60" y="50" width="160" height="80" rx="44" fill="url(#gHighlight)"/>

    <!-- Transformation mark: two text lines + cycle arrow + sparkle -->
    <g transform="translate(60,50)">
      <!-- Gradient ring -->
      <path d="M110 34
               C 142 34, 168 60, 168 92
               C 168 124, 142 150, 110 150
               C 78 150, 52 124, 52 92
               C 52 60, 78 34, 110 34Z"
            fill="none" stroke="url(#gBrand)" stroke-width="10" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

      <!-- Two "text" lines -->
      <rect x="62" y="78" width="96" height="10" rx="5" fill="#E5E7EB" opacity="0.92"/>
      <rect x="62" y="100" width="74" height="10" rx="5" fill="#E5E7EB" opacity="0.78"/>

      <!-- Cycle arrow head (suggests rewrite/refresh) -->
      <path d="M160 78 L184 78 L172 62 Z" fill="url(#gBrand)"/>

      <!-- Small sparkle (AI magic) -->
      <g transform="translate(44,44)">
        <path d="M24 14
                 L27 22
                 L35 25
                 L27 28
                 L24 36
                 L21 28
                 L13 25
                 L21 22 Z"
              fill="url(#gBrand)" opacity="0.95"/>
        <circle cx="38" cy="14" r="2.4" fill="#A855F7" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(260,0)">
    <text x="0" y="155"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji','Segoe UI Emoji'"
          font-size="92"
          font-weight="750"
          letter-spacing="-1.5"
          fill="#0B1220">
      Reword
    </text>

    <!-- Gradient overlay for "Re" (subtle brand cue) -->
    <text x="0" y="155"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji','Segoe UI Emoji'"
          font-size="92"
          font-weight="750"
          letter-spacing="-1.5"
          fill="url(#gBrand)">
      Re
    </text>

    <!-- Tagline (optional) -->
    <text x="2" y="196"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
          font-size="22"
          font-weight="520"
          fill="#475569"
          opacity="0.95">
      Instant tone rewrites
    </text>
  </g>
</svg>
